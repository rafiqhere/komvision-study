name: logicandcrayons  # Project name for the compose stack

services:  # Define all containers/services
  nginx:
    image: nginx:latest  # Official NGINX web server image
    container_name: nginx  # Custom container name
    ports:
      - "${PORT:-80}:80"  # Map host port (default 80) to container port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf  # Main NGINX config (bind mount)
      - ./nginx/apps:/etc/nginx/conf.d/apps:ro  # App configs (read-only)
      - ./nginx/utils:/etc/nginx/conf.d/utils:ro  # Utility configs (read-only)
    command: [nginx-debug, '-g', 'daemon off;']  # Run NGINX in foreground (debug mode)
    depends_on:
      - homer  # Start homer before nginx
      - jenkins  # Start jenkins before nginx

    networks:
      - dev  # Attach to dev network

  homer:
    image: b4bz/homer:latest  # Dashboard UI image
    restart: unless-stopped  # Restart unless manually stopped
    container_name: homer  # Container name

    # ports:
    #   - "${HOMER_PORT-8080}:8080"

    volumes:
      - ./homer/assets:/www/assets  # Static assets for UI
      - ./homer/logo.svg:/www/logo.svg  # Custom logo

    environment:
      - UID=1000  # User ID inside container
      - GID=1000  # Group ID inside container

    networks:
      - dev  # use dev network
  # smtp-relay:
  #   image: boky/postfix
  #   ports:
  #     - "${SMTP_RELAY_PORT:-587}:587"
  #   environment:
  #     ALLOWED_SENDER_DOMAINS: ${SMTP_RELAY_SENDER_DOMAINS:-example.com}
  #     RELAYHOST: "${SMTP_RELAY_HOST:-[smtp.sendgrid.net]:587}"
  #     RELAYHOST_USERNAME: ${SMTP_RELAY_HOST:-apikey}
  #     RELAYHOST_PASSWORD: ${SMTP_RELAY_HOST:-your-api-key}

  #   networks:
  #     - mail

  jenkins:
    build:  # Build custom Jenkins image
      context: jenkins  # Docker build context folder
      dockerfile: Dockerfile  # Dockerfile used situated in the context folder.
    container_name: jenkins  # Container name
    hostname: jenkins.local  # Internal hostname
    restart: unless-stopped  # Auto restart unless menually stopped.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/jenkins/health || exit 1"]  # Health check endpoint
      interval: 30s  # Run check every 30 seconds
      timeout: 5s  # Timeout for health check
      retries: 5  # Retry 5 times before marking unhealthy
    cap_add:
      - NET_ADMIN  # Network admin capability
      - SYS_MODULE  # Kernel module capability (almost root user)

    ports:
      - "${JENKINS_AGENT_PORT:-50000:50000}"  # Jenkins agent communication port
     #   - "${JENKINS_PORT-8081}:8080"
    
    # studying environment
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

      AWS_REGION: "${AWS_REGION}"
      AWS_APPLICATION_TAG: "${AWS_APPLICATION_TAG}"

      # JENKINS_ROLE_ARN: "${JENKINS_ROLE_ARN}"
      JENKINS_HOME: "${JENKINS_HOME:-/var/jenkins_home}"
      JENKINS_OPTS: "${JENKINS_OPTS:---prefix=/jenkins}"
      JENKINS_URL: "${JENKINS_URL:-${ROOT_URL}/jenkins}"

      CASC_JENKINS_CONFIG: "${JENKINS_HOME:-/var/jenkins_home}/casc_configs"
      DOCKER_STACK_DIR: "${DOCKER_STACK_DIR:-/opt/stacks}"

    volumes:
      - jenkins-home:${JENKINS_HOME:-/var/jenkins_home}  # mount persistent Jenkins data to the specified location.
      - ./jenkins/casc:${JENKINS_HOME:-/var/jenkins_home}/casc_configs
      
      - /var/run/docker.sock:/var/run/docker.sock  # Allow Docker control inside Jenkins
      
      - "${JENKINS_AWS_CREDENTIALS:-./.aws}:${JENKINS_HOME:-/var/jenkins_home}/.aws:ro"

    networks:
      - dev  # use dev network
  # zulip:
  #   image: ghcr.io/zulip/zulip-server:12.0-0
  #   container_name: zulip
  #   environment:
  #     DISABLE_HTTPS: "${ZULIP_DISABLE_HTTPS}"
  #     SETTING_EXTERNAL_HOST: "${ZULIP_URL}"
  #     SETTING_ZULIP_ADMINISTRATOR: "${ZULIP_ADMINISTRATOR:-kom@ohmvision.com}"

  #   ports:
  #     - "${ZULIP_PORT-8082}:80"

  #   networks:
  #     - dev
  #     - mail

  postgres:
    image: library/postgres:latest  # Official PostgreSQL image
    container_name: postgres  # Container name
    healthcheck:
      test: pg_isready --dbname=postgres --host=127.0.0.1 --port=5432 --username=postgres  # DB health check
      interval: 2s  # Check interval
      timeout: 20s  # Timeout
      retries: 10  # Retry count

    environment:
      POSTGRES_DB: postgres  # Default database name
      POSTGRES_USER: postgres  # DB user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password  # Password from secret file

    volumes:
      - postgres-data:/var/lib/postgresql  # Persistent DB storage
      - "${POSTGRES_PASSWORD:-./.secrets/postgres/db_password}:/run/secrets/db_password:ro"  # DB password secret file mapping.
      # - ./postgres/init:/docker-entrypoint-initdb.d:ro
    
    ports:
      - "${POSTGRES_PORT-5432}:5432"  # Expose PostgreSQL port
    
    networks:
      - db  # DB network only

volumes:
  jenkins-home:  # Persistent volume for Jenkins data
  postgres-data:  # Persistent volume for Postgres data

networks:
  dev:  # Shared dev network (nginx, jenkins, homer)
  db:  # Isolated database network
  # mail:  # Mail-related network (unused/commented services)
 