name: logicandcrayons

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/apps:/etc/nginx/conf.d/apps:ro
      - ./nginx/utils:/etc/nginx/conf.d/utils:ro
    command: [nginx-debug, '-g', 'daemon off;']
    depends_on:
      - homer
      - jenkins

    networks:
      - dev

  homer:
    image: b4bz/homer:latest
    restart: unless-stopped
    container_name: homer

    # ports:
    #   - "${HOMER_PORT-8080}:8080"

    volumes:
      - ./homer/assets:/www/assets
      - ./homer/logo.svg:/www/logo.svg

    environment:
      - UID=1000
      - GID=1000

    networks:
      - dev
  # smtp-relay:
  #   image: boky/postfix
  #   ports:
  #     - "${SMTP_RELAY_PORT:-587}:587"
  #   environment:
  #     ALLOWED_SENDER_DOMAINS: ${SMTP_RELAY_SENDER_DOMAINS:-example.com}
  #     RELAYHOST: "${SMTP_RELAY_HOST:-[smtp.sendgrid.net]:587}"
  #     RELAYHOST_USERNAME: ${SMTP_RELAY_HOST:-apikey}
  #     RELAYHOST_PASSWORD: ${SMTP_RELAY_HOST:-your-api-key}

  #   networks:
  #     - mail

  jenkins:
    build: 
      context: jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    hostname: jenkins.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/jenkins/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    ports:
        - "${JENKINS_AGENT_PORT:-50000:50000}"
    #   - "${JENKINS_PORT-8081}:8080"

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

      AWS_REGION: "${AWS_REGION}"
      AWS_APPLICATION_TAG: "${AWS_APPLICATION_TAG}"

      # JENKINS_ROLE_ARN: "${JENKINS_ROLE_ARN}"
      JENKINS_HOME: "${JENKINS_HOME:-/var/jenkins_home}"
      JENKINS_OPTS: "${JENKINS_OPTS:---prefix=/jenkins}"
      JENKINS_URL: "${JENKINS_URL:-${ROOT_URL}/jenkins}"

      CASC_JENKINS_CONFIG: "${JENKINS_HOME:-/var/jenkins_home}/casc_configs"
      DOCKER_STACK_DIR: "${DOCKER_STACK_DIR:-/opt/stacks}"

    volumes:
      - jenkins-home:${JENKINS_HOME:-/var/jenkins_home}
      - ./jenkins/casc:${JENKINS_HOME:-/var/jenkins_home}/casc_configs

      - /var/run/docker.sock:/var/run/docker.sock

      - "${JENKINS_AWS_CREDENTIALS:-./.aws}:${JENKINS_HOME:-/var/jenkins_home}/.aws:ro"

    networks:
      - dev
  # zulip:
  #   image: ghcr.io/zulip/zulip-server:12.0-0
  #   container_name: zulip
  #   environment:
  #     DISABLE_HTTPS: "${ZULIP_DISABLE_HTTPS}"
  #     SETTING_EXTERNAL_HOST: "${ZULIP_URL}"
  #     SETTING_ZULIP_ADMINISTRATOR: "${ZULIP_ADMINISTRATOR:-kom@ohmvision.com}"

  #   ports:
  #     - "${ZULIP_PORT-8082}:80"

  #   networks:
  #     - dev
  #     - mail

  postgres:
    image: library/postgres:latest
    container_name: postgres
    healthcheck:
      test: pg_isready --dbname=postgres --host=127.0.0.1 --port=5432 --username=postgres
      interval: 2s
      timeout: 20s
      retries: 10

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    volumes:
      - postgres-data:/var/lib/postgresql
      - "${POSTGRES_PASSWORD:-./.secrets/postgres/db_password}:/run/secrets/db_password:ro"
      # - ./postgres/init:/docker-entrypoint-initdb.d:ro

    ports:
      - "${POSTGRES_PORT-5432}:5432"

    networks:
      - db

volumes:
  jenkins-home:
  postgres-data:

networks:
  dev:
  db:
  mail:
 